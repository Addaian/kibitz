# Base model and adapter shape.  See README §6 and Decision Log row 11.
#
# The plan's peft + bitsandbytes stack is CUDA-only and cannot run on this
# machine (Apple M1 Max), so training goes through MLX.  Model ids below are
# MLX-converted community quantisations, not the original HF repos.

base_model: "mlx-community/Mistral-7B-Instruct-v0.3-4bit"

# The same model at full precision, for scripts/train_cuda.py on an NVIDIA GPU.
# Gated: accept the licence on Hugging Face and set HF_TOKEN.
hf_base_model: "mistralai/Mistral-7B-Instruct-v0.3"

# The runtime Kibitz ships with is llama.cpp, on Mac, Windows and Linux: a stock
# GGUF of the same base with the adapter from scripts/convert_gguf.py applied at
# load time. Its model files are set in kibitz/model.py, since an installed
# Kibitz has no configs/ directory.

# Alternatives, all pre-quantised for MLX:
#   mlx-community/Qwen2.5-7B-Instruct-4bit          strong technical prose
#   mlx-community/Meta-Llama-3.1-8B-Instruct-4bit   README's second choice
#   mlx-community/Llama-3.2-3B-Instruct-4bit        fast, for pipeline smoke tests

fine_tune_type: lora

# How many transformer layers get adapters, counting from the top. Fewer layers
# trains faster and overfits less on a single-domain corpus like this one.
num_layers: 16

lora_parameters:
  rank: 16
  scale: 20.0      # MLX applies `scale * BA` directly. This is NOT peft's
                   # alpha/rank ratio — §7.2's "alpha: 32" would be scale 2.0.
                   # 20.0 is the mlx-lm convention and what its defaults assume.
  dropout: 0.05
